# Safe search by tags (docs/decisions/0076). A page's own tags are evidence, not proof:
#
#   * one STRONG tag of an active category hides the page (a word that is almost only used for adult material);
#   * WEAK tags hide it only when two of them are on the page (a word that has innocent uses: a bikini, "sex",
#     a nude in an art class).
#
# A category with level = "moderate" is active in the Moderate and Strict modes; level = "strict" only in Strict.
# Tags are compared without capitals, spaces, hyphens, underscores and "#": "Rope Bunny", "rope_bunny" and "#RopeBunny" are
# one tag. A different word is a different tag: list aliases yourself, there is no pattern matching ("ropebunnyart" is not
# "ropebunny"), because patterns hide innocent pages.
#
# Deliberately NOT here, so that nothing medical or educational is hidden: sex education, sexual and reproductive health,
# anatomy, figure drawing, artistic nudes, naturism, breastfeeding, and the news and law of sexual crimes. Add a category
# of your own in a copy of this file (`[safe_search] tags_file = "safe_tags.toml"`) if you want any of them hidden.

